<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 540" width="100%" role="img" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif">
  <title>DevFlow architecture</title>
  <desc>Four data sources feed an ingestion pipeline into a vector store, queried by an agent layer that powers three user modes: departure, onboarding, and knowledge map.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="30" text-anchor="middle" font-size="16" font-weight="500" fill="#2C2C2A">DevFlow architecture</text>
  <text x="340" y="50" text-anchor="middle" font-size="12" fill="#5F5E5A">Multi-agent RAG over heterogeneous engineering knowledge</text>

  <!-- Sources (gray) -->
  <g>
    <rect x="40" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="105" y="103" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Git history</text>
    <text x="105" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Commits, authors</text>
  </g>
  <g>
    <rect x="197" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="262" y="103" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Pull requests</text>
    <text x="262" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Descriptions</text>
  </g>
  <g>
    <rect x="354" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="419" y="103" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Code comments</text>
    <text x="419" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">Inline docs</text>
  </g>
  <g>
    <rect x="511" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
    <text x="576" y="103" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#444441">Exit answers</text>
    <text x="576" y="123" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">AI-captured</text>
  </g>

  <!-- Funnel arrows from sources to ingestion -->
  <line x1="105" y1="136" x2="270" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="262" y1="136" x2="310" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="419" y1="136" x2="370" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="576" y1="136" x2="410" y2="190" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pipeline (purple) -->
  <g>
    <rect x="240" y="190" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="213" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Ingestion</text>
    <text x="340" y="233" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">FastAPI + chunking</text>
  </g>

  <line x1="340" y1="246" x2="340" y2="278" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="240" y="278" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="301" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Vector store</text>
    <text x="340" y="321" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">Chroma + embeddings</text>
  </g>

  <line x1="340" y1="334" x2="340" y2="366" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="240" y="366" width="200" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
    <text x="340" y="389" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#3C3489">Agent layer</text>
    <text x="340" y="409" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">LangGraph + Claude</text>
  </g>

  <!-- Fan-out arrows from agent layer to user modes -->
  <line x1="340" y1="422" x2="130" y2="464" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="422" x2="340" y2="464" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="340" y1="422" x2="550" y2="464" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- User modes (teal) -->
  <g>
    <rect x="40" y="464" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="130" y="487" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Departure</text>
    <text x="130" y="507" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Exit interview AI</text>
  </g>
  <g>
    <rect x="250" y="464" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="340" y="487" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Onboarding</text>
    <text x="340" y="507" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Grounded chat</text>
  </g>
  <g>
    <rect x="460" y="464" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
    <text x="550" y="487" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="500" fill="#085041">Knowledge map</text>
    <text x="550" y="507" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#0F6E56">Coverage view</text>
  </g>
</svg>
